[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-safe"
version = "0.1.0"
description = "Secure credential proxy for AI coding agents — inject secrets safely, audit everything"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "The Foundry", email = "foundry@jeevesbot.io" },
]
keywords = ["ai", "agents", "security", "credentials", "secrets", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.9.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
agent-safe = "agent_safe.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
